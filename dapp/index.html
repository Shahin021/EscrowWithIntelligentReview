<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GenLayer Escrow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="ambience" aria-hidden="true">
      <span class="glow glow-blue"></span>
      <span class="glow glow-violet"></span>
      <span class="grid"></span>
    </div>

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" id="logo"></div>
        <div class="brand-text">
          <span class="brand-name">GenLayer Escrow</span>
          <span class="brand-sub">Milestone settlement, adjudicated on-chain</span>
        </div>
      </div>

      <div class="topbar-right">
        <div class="chip" id="tx-chip" data-state="idle">
          <span class="chip-dot"></span>
          <span class="chip-label" id="tx-status" role="status">Ready</span>
        </div>
        <button id="connect" class="btn btn-primary" type="button">Connect wallet</button>
        <button id="disconnect" class="btn btn-ghost" type="button" hidden>Disconnect</button>
      </div>
    </header>

    <nav class="ws-tabs" role="tablist" aria-label="Workspace">
      <button type="button" role="tab" data-tab="project" aria-selected="false">Project</button>
      <button type="button" role="tab" data-tab="projects" aria-selected="false">Your projects</button>
      <button type="button" role="tab" data-tab="create" aria-selected="false">Create</button>
    </nav>

    <main id="app">
      <section class="panel panel-network" id="network-panel"></section>
      <p id="network-warning" class="notice" hidden></p>

      <div class="ws-view" data-panel="project">
        <section class="overview" id="overview"></section>

        <div class="columns">
          <div class="column column-main">
            <section id="milestones" class="stack"></section>
            <section id="outflows" class="stack"></section>
          </div>
          <aside class="column column-side">
            <section id="parties" class="stack"></section>
            <section id="actions" class="stack"></section>
            <section class="panel ws-activity-panel" id="activity-panel" hidden></section>
            <section class="panel ws-activity-panel" id="automation-panel" hidden></section>
          </aside>
        </div>

        <section class="panel receipt-panel" id="receipt-panel" hidden></section>
      </div>

      <div class="ws-view" data-panel="projects" hidden>
        <section class="panel" id="projects-panel"></section>
      </div>

      <div class="ws-view" data-panel="create" hidden>
        <div class="columns">
          <section class="panel ws-create" id="create-panel"></section>
          <aside class="column column-side">
            <section class="panel ws-activity-panel" id="create-activity"></section>
          </aside>
        </div>
      </div>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
