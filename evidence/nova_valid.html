<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nova</title>
</head>
<body>
  <main>
    <h1>Welcome to Nova</h1>

    <p>
      Nova is a productivity product that helps teams organize tasks,
      coordinate daily work, and collaborate more efficiently.
    </p>

    <form action="/subscribe" method="post">
      <label for="email">Email address</label>
      <input
        id="email"
        name="email"
        type="email"
        required
      >
      <button type="submit">Sign up</button>
    </form>
  </main>
</body>
</html>
